name: CI

on:
  push:
    branches: [ main, 'milestone-*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: finance_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/finance_manager_test?schema=public"

      - name: Run Linting
        run: npm run lint

      - name: Run Unit Tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/finance_manager_test?schema=public"
          NEXTAUTH_SECRET: "ci-test-secret-at-least-32-characters-long"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Build Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/finance_manager_test?schema=public"
          NEXTAUTH_SECRET: "ci-test-secret-at-least-32-characters-long"
          NEXTAUTH_URL: "http://localhost:3000"
